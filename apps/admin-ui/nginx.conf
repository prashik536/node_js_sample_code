server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/auth/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://auth-service:3000;
    }

    location ^~ /api/products {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://catalog-service:3000;
    }

    location ^~ /api/orders {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://order-service:3000;
    }

    location ^~ /api/delivery {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://delivery-service:3000;
    }

    location ^~ /api/notifications {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://notification-service:3000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}